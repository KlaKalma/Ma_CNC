# =====================================================================
# LC10E-calib.ini — CONFIG DE CALIBRATION (à lancer occasionnellement)
#
# Identique à LC10E.ini SAUF le homing de l'axe X, qui passe en
# HOME_USE_INDEX pour déclencher le homing interne du variateur
# (auto-home vers la fin de course - + signal Z) sous supervision de la
# FSM de homing LinuxCNC. Machine ON, sûr.
#
# Usage :  linuxcnc /home/cnc/linuxcnc/configs/Ma_CNC/LC10E-calib.ini
#   1. F2 (machine ON). 2. Home X (bouton PyVCP « Home X » ou AXIS).
#   3. Le drive va tamponner la fin de course - + Z et fige l'origine
#      (stockée dans l'encodeur absolu). 4. Quitter, relancer LC10E.ini
#      (config normale) : l'absolu adopte la nouvelle origine.
#
# Prérequis drive (AU PANNEAU, persiste) : 6098=1, 60E6=0, 607C=0,
#   6099:01/:02 vitesses lentes, 609A accel, 2005:24 timeout.
#
# ⚠️ NE PAS utiliser au quotidien : c'est LC10E.ini (HOME_ABSOLUTE_ENCODER)
#    qui est la config de production.
# =====================================================================

[EMC]
MACHINE = LC10E_machine_calib
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
EDITOR = gedit
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
CYCLE_TIME = 0.100
PREVIEW_TIMEOUT = 1
PYVCP_MAX_RATE = 0.01
PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files
OPEN_FILE = /home/cnc/linuxcnc/nc_files/test-servo.ngc
INTRO_GRAPHIC =
INTRO_TIME = 0
PYVCP = pyvcp_panel.xml

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000

[HAL]
HALFILE = LC10E.hal
HALFILE = spindle.hal
HALFILE = calib_homing.hal
POSTGUI_HALFILE = pyvcp_panel.hal
HALUI = halui

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 500.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[AXIS_X]
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0

[AXIS_Y]
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0

[AXIS_Z]
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0

# --- Axe X : homing piloté par le drive (HOME_USE_INDEX) ---
# HOME_SEARCH_VEL=0 : pas de phase de recherche LinuxCNC (c'est le drive qui
# fait le mouvement, à la vitesse 6099 réglée au panneau).
# HOME_LATCH_VEL≠0 : requis pour armer le mode index. HOME_USE_INDEX=TRUE :
# attend le handshake index-enable<=>cia402.home (cf. calib_homing.hal).
# HOME_IGNORE_LIMITS=YES : laisse le drive tamponner la fin de course pendant le homing.
[JOINT_0]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 500.0
FERROR = 500.0
MIN_FERROR = 50.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 1.0
HOME_USE_INDEX = TRUE
HOME_IGNORE_LIMITS = YES

# Y/Z : inchangés (home immédiat). Pas encore équipés de capteurs ; ne PAS
# faire « Home All » ici tant qu'ils n'ont pas leur fin de course + params drive.
[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 500.0
FERROR = 500.0
MIN_FERROR = 50.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_IGNORE_LIMITS = YES

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 500.0
FERROR = 500.0
MIN_FERROR = 50.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_IGNORE_LIMITS = YES
